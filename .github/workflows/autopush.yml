# 主枝之自推（1021 作者令「GitHub 自己去推」；1022 改）：一章封版即推一枝「章-N」（不动之标），GitHub 之机把它并进主枝、照 pre-push 之闸全跑；绿即推主枝。零 token、沙盒⛔候。
# 1022 之改（403 封後主枝未进、书停）：旧以「存底枝之正文一变」触发——存底守五分一推，每推即触一回而 cancel 前一回，
#   推闸跑二十分，五回俱被消、末回又败，主枝终未进。今以「章-N」之推触发（一章一回、⛔互消），且由此机自并（主枝已前进亦可并）。
name: autopush
on:
  push:
    branches: ['章-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autopush
  cancel-in-progress: false
jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/the-novel-review-4dtuit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 并入封版之章
        run: |
          git config user.name autopush
          git config user.email autopush@users.noreply.github.com
          T="${GITHUB_SHA}"
          git fetch -q origin "$T" || true
          if git merge-base --is-ancestor "$T" HEAD; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "封版之章已在主枝，免跑"; exit 0; fi
          git merge --no-edit "$T" -m "autopush：并入 ${GITHUB_REF_NAME}（封版之章）"
      - name: 推闸（与 工具/githooks/pre-push 同）
        if: env.SKIP != '1'
        run: bash 工具/githooks/pre-push
      - name: 推主枝
        if: env.SKIP != '1'
        run: git push origin HEAD:refs/heads/claude/the-novel-review-4dtuit
